<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2C50A5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asistencia Migo">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/MigoAsistencia.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Asistencia · Migo</title>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">Asistencia</div>
    <div class="header-sub">Registro de jornada laboral</div>
  </div>
</div>

<div class="clock-bar">
  <span class="clock-time" id="clockTime">00:00:00</span>
  <span class="clock-sep">·</span>
  <span class="clock-date" id="clockDate"></span>
</div>

<div class="main">

  <div class="card" id="setupCard">
    <div class="card-title">Bienvenido 👋</div>
    <div class="card-sub">Ingresa tu cédula una sola vez — quedará guardada en este dispositivo.</div>
    <div class="field">
      <label for="inCedula">Cédula de identidad</label>
      <input type="text" id="inCedula" placeholder="0912345678"
             maxlength="10" inputmode="numeric" autocomplete="off">
    </div>
    <div class="err" id="setupErr"></div>
    <button class="btn-save" onclick="guardar()">Guardar y continuar →</button>
  </div>

  <div class="att-card" id="attCard">

    <div class="user-pill">
      <span class="pill-icon">🪪</span>
      <div>
        <div class="pill-ced" id="pillCed">—</div>
        <div class="pill-sub">Cédula guardada en este dispositivo</div>
      </div>
      <button class="pill-edit" onclick="editarCedula()" title="Cambiar cédula">✏️</button>
    </div>

    <div id="formView">
      <div class="btns-wrap">
        <button class="att-btn btn-entrada" id="btnEntrada" onclick="marcar('entrada')">
          <span class="att-btn-emoji">🟢</span>
          <div class="att-btn-text">
            <span class="att-btn-label">Entrada</span>
            <span class="att-btn-sub">Inicio de jornada</span>
          </div>
        </button>
        <button class="att-btn btn-salida" id="btnSalida" onclick="marcar('salida')">
          <span class="att-btn-emoji">🔵</span>
          <div class="att-btn-text">
            <span class="att-btn-label">Salida</span>
            <span class="att-btn-sub">Fin de jornada</span>
          </div>
        </button>
      </div>

      <div class="motivo-wrap">
        <label for="motivo">Motivo <span class="opt-tag">opcional</span></label>
        <textarea id="motivo" placeholder="Atraso, permiso, salida anticipada..."></textarea>
      </div>
    </div>

    <div class="success" id="successView">
      <div class="success-circle" id="sucCircle">✅</div>
      <h2 id="sucTitle">¡Registrado!</h2>
      <p id="sucSub"></p>
      <div class="success-time" id="sucTime"></div>
      <button class="btn-back" onclick="volver()">← Volver</button>
    </div>

  </div>

</div>

<script src="assets/js/app.js"></script>
</body>
</html>
